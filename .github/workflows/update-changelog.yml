name: Update Changelog

on:
  release:
    types: [released]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # The release names its branch as the target, or a commit when it was made
      # from one; a commit falls back to the default branch.
      - name: Find the branch of the release
        id: branch
        env:
          TARGET: ${{ github.event.release.target_commitish }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${REPOSITORY}.git" "refs/heads/${TARGET}" > /dev/null 2>&1; then
            echo "name=${TARGET}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${DEFAULT_BRANCH}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.branch.outputs.name }}

      - name: Update changelog
        uses: stefanzweifel/changelog-updater-action@a938690fad7edf25368f37e43a1ed1b34303eb36 # v1
        with:
          latest-version: ${{ github.event.release.name }}
          release-notes: ${{ github.event.release.body }}
          compare-url-target-revision: ${{ steps.branch.outputs.name }}

      - name: Commit updated changelog
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          branch: ${{ steps.branch.outputs.name }}
          commit_message: Update CHANGELOG
          file_pattern: CHANGELOG.md
